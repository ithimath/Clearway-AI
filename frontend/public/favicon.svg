<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg { fill: #0F172A; }
      .rail-primary { stroke: #0EA5E9; }
      .rail-fill { fill: #0EA5E9; }
      .signal-dot { fill: #38BDF8; }
      @media (prefers-color-scheme: dark) {
        .rail-primary { stroke: #38BDF8; }
        .rail-fill { fill: #38BDF8; }
        .signal-dot { fill: #7DD3FC; }
      }
    </style>
  </defs>
  <!-- Background Navy Squircle -->
  <rect class="bg" width="32" height="32" rx="7" />
  
  <!-- Stylized "C" Arc (Outer Rail Loop) -->
  <path d="M 23 9 C 14 9, 7 12, 7 16 C 7 20, 14 23, 23 23" 
        fill="none" class="rail-primary" stroke-width="2.6" stroke-linecap="round" />
  
  <!-- Clearway Parallel Center Rail Line (Open Forward Path) -->
  <line x1="12" y1="16" x2="25" y2="16" 
        class="rail-primary" stroke-width="2.6" stroke-linecap="round" />

  <!-- Railway Track Sleepers / Ties linking the C path -->
  <line x1="14" y1="11.5" x2="14" y2="20.5" 
        class="rail-primary" stroke-width="1.8" stroke-linecap="round" />
  <line x1="19" y1="12.5" x2="19" y2="19.5" 
        class="rail-primary" stroke-width="1.8" stroke-linecap="round" />

  <!-- Forward Clear Signal Indicator -->
  <circle cx="25" cy="16" r="1.6" class="signal-dot" />
</svg>
